name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    # Ο φθηνότερος έλεγχος (~10s): πιάνει αχρησιμοποίητα imports, blocking IO σε
    # async, implicit Optional, ασφαλείς απλοποιήσεις. Η config (backend/ruff.toml)
    # τεκμηριώνει ποιοι κανόνες είναι απενεργοποιημένοι και γιατί — κυρίως false
    # positives για FastAPI Depends() και για τα ελληνικά σχόλια.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: ruff check
        working-directory: backend
        run: ruff check .

  fast-tests:
    # Model-free tests (validators + security). ~40s, γρήγορο σήμα σε κάθε push
    # χωρίς να περιμένει κατέβασμα μοντέλων. Τα tests του RAG πυρήνα τρέχουν
    # στο ξεχωριστό core-tests job παρακάτω.
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-dummy-secret-key-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight test deps
        run: |
          pip install pydantic==2.14.1 "python-jose[cryptography]==3.5.0" \
                      passlib==1.7.4 bcrypt==4.0.1 python-dotenv pytest==8.3.4 \
                      httpx==0.28.1 loguru fastapi==0.162.0 \
                      starlette==1.10.0 sqlalchemy python-multipart "numpy<2"
      # numpy: το test_lc_vs_rag εισάγει το probe_lc_vs_rag -> scoreboard -> embedder_switch (numpy).
      # Ίδιο όριο με το requirements.txt.
      # ΤΙ ΤΡΕΧΕΙ ΕΔΩ ΚΑΙ ΓΙΑΤΙ ΟΧΙ ΣΤΟ core-tests: και τα τέσσερα αρχεία
      # αποφεύγουν εντελώς το `import ai_core` (2.4GB μοντέλα, ~1 λεπτό):
      #   test_gemini_rest    — ψεύτικος httpx client, χωρίς δίκτυο/API key
      #   test_api_endpoints  — ai_core σε stub + SQLite in-memory αντί Postgres·
      #                         καλύπτει το AUTHORIZATION (απομόνωση χρηστών),
      #                         που καμία μετρική RAG δεν μπορεί να ελέγξει
      - name: Run validator + security + REST + API endpoint + metrics tests
        working-directory: backend
        # Το test_metrics.py ανήκει εδώ: το metrics.py δεν έχει ΚΑΜΙΑ εξάρτηση
        # (ούτε ai_core) — μόνο threading + time από τη stdlib.
        #
        # Το test_rate_limit.py ομοίως: SQLite in-memory, κανένα μοντέλο. Ελέγχει
        # ότι το όριο ΟΝΤΩΣ κόβει — τα endpoint tests χτυπούν το /login αλλά ποτέ
        # αρκετές φορές ώστε να ενεργοποιηθεί, δηλαδή επιβεβαιώνουν μόνο ότι δεν
        # σκάει. Και ότι η αύξηση γίνεται ΜΕΣΑ στη βάση: αν ξαναγραφτεί ως
        # read-modify-write σε Python, το race επανέρχεται ΣΙΩΠΗΛΑ.
        #
        # Το test_scope_domain.py ομοίως: το corpus_glossary είναι leaf module (μόνο re/
        # unicodedata/collections). Ελέγχει ότι ο καθολικός descriptor ισχύει ΜΟΝΟ για τα
        # αρχεία που περιγράφει (PDF άλλου θέματος -> γενικό πεδίο, 28/9/2026).
        #
        # Το test_doc_routing.py ομοίως: το doc_routing είναι leaf module (μόνο itertools/json).
        # Ελέγχει τη δρομολόγηση των ερωτήσεων δύο εγγράφων ΚΑΙ ότι τα ονόματα του
        # corpus_names.json είναι ακριβώς αυτά που μετρήθηκαν (30/9/2026).
        # Τα test_table_scoring.py και test_model_guard.py: αυστηρός έλεγχος πινάκων και φραγή
        # μοντέλων που ανακατευθύνονται σιωπηλά από 1/12/2026· μόνο stdlib (18/11/2026).
        # Το test_claim_support.py: ντετερμινιστικό μέρος του ελέγχου στήριξης ανά πρόταση (βήμα 5).
        # Το test_pdf_report.py: «Text extracted from X/Y pages» (κύκλος 2, βήμα 1).
        # Το test_sufficiency.py: ο κριτής επάρκειας της δεύτερης αναζήτησης (κύκλος 2, βήμα 2β).
        # Το test_full_text.py: ο router «όλο το κείμενο ή RAG» και η βαθμονόμηση tokens (24/11/2026).
        # Το test_source_passages.py: απόσπασμα πηγής ανά πρόταση (κύκλος 2, βήμα 6).
        # Το test_heldout.py: οι κανόνες της τελικής μέτρησης στο κλειστό σετ (κύκλος 2, βήμα 7).
        run: |
          pytest tests/test_schemas.py tests/test_security.py \
                 tests/test_gemini_rest.py tests/test_api_endpoints.py \
                 tests/test_metrics.py tests/test_rate_limit.py \
                 tests/test_scope_domain.py tests/test_doc_routing.py \
                 tests/test_generate_once_finish.py tests/test_table_scoring.py \
                 tests/test_model_guard.py tests/test_claim_support.py tests/test_pdf_report.py \
                 tests/test_sufficiency.py tests/test_lc_vs_rag.py tests/test_full_text.py \
                 tests/test_source_passages.py tests/test_scoreboard_frozen.py \
                 tests/test_heldout.py -v

  core-tests:
    # Τα tests του RAG πυρήνα: el_tokenize, _has_greek, _build_where, _rrf_fuse
    # (καθαρή λογική σύντηξης), ο relevance gate με stubbed collection/reranker,
    # και η υπογραφή corpus που κάνει τα caches ασφαλή σε πολλούς workers.
    #
    # ΓΙΑΤΙ ΞΕΧΩΡΙΣΤΟ JOB: το tests/test_rag_core.py κάνει `import ai_core`, που
    # φορτώνει bge-m3 + cross-encoder σε module level (~2.4GB). Με cache στο
    # HF_HOME το πρώτο run είναι ~8 λεπτά και τα επόμενα ~2 — αποδεκτό ως δεύτερη
    # γραμμή άμυνας, αλλά όχι ως blocker του γρήγορου σήματος.
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-dummy-secret-key-not-used-in-production
      # Το ai_core διαβάζει το key στο import· τα tests δεν κάνουν καμία κλήση
      # δικτύου (η optimize_query είναι monkeypatched).
      GEMINI_API_KEY: ci-dummy-no-api-calls-in-tests
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: hf-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Install CPU-only torch first
        # Χωρίς αυτό το pip τραβάει το CUDA build (~2.5GB), άχρηστο σε runner.
        run: pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Check installed dependency compatibility
        run: pip check

      - name: Run RAG core tests
        working-directory: backend
        # Το test_corpus_signature.py ανήκει εδώ για τον ΙΔΙΟ λόγο: δοκιμάζει
        # την ΠΡΑΓΜΑΤΙΚΗ _corpus_signature του ai_core, όχι αντίγραφό της. Μια
        # γρήγορη εκδοχή που αντέγραφε τη λογική θα περνούσε και με σπασμένο
        # ai_core — ψεύτικη ασφάλεια ακριβώς εκεί που πονάει (multi-worker).
        #
        # Το test_corrective_retrieval.py επίσης: καλεί το ΠΡΑΓΜΑΤΙΚΟ
        # search_documents ώστε να πιάσει λάθη ΣΥΝΔΕΣΗΣ gate <-> retry, που
        # κανένα unit test της _corrective_retry μόνης της δεν βλέπει.
        # Το rewrite είναι stubbed -> μηδέν κλήσεις δικτύου/API.
        run: |
          pytest tests/test_rag_core.py tests/test_corpus_signature.py \
                 tests/test_corrective_retrieval.py tests/test_citations.py \
                 tests/test_vector_store.py tests/test_ingestion.py tests/test_pdf_hidden.py \
                 tests/test_full_text_path.py -v
