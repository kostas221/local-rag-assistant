services:
  db:
    image: postgres:15-alpine
    container_name: v2_postgres
    restart: always
    environment:
      POSTGRES_USER: zosi_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ai_platform_db
    ports:
      - "127.0.0.1:5434:5432"   # host 5434 (5432=v1, 5433=sandbox) — ΟΧΙ εκτεθειμένο στο δίκτυο
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: v2_backend
    restart: always
    ports:
      - "127.0.0.1:8010:8000"   # host 8010 (8000=v1, 8001=sandbox) — ΟΧΙ δημόσιο
    volumes:
      - ./backend:/app
      - chromadb_data:/app/vector_db
      - huggingface_cache:/home/appuser/.cache/huggingface
    environment:
      - DATABASE_URL=postgresql://zosi_admin:${POSTGRES_PASSWORD}@db:5432/ai_platform_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8502}
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 300s

  frontend:
    build: ./frontend
    container_name: v2_frontend
    restart: always
    ports:
      - "8502:8501"   # host 8502 (το 8501 το κρατά το v1). Στο deploy: πίσω από proxy + HTTPS
    volumes:
      - ./frontend:/app
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  chromadb_data:
  huggingface_cache: