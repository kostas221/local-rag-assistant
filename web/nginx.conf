# Το νέο UI στην παραγωγή: στατικά αρχεία + /api προς τον backend, ίδιο origin (χωρίς CORS), όπως το proxy του Vite.
# Τρέχει χωρίς root (nginx-unprivileged), στην 8080.

# Ο DNS του Docker: αν ο backend ξαναξεκινήσει με άλλη IP, το nginx τη βρίσκει ξανά (ένα σταθερό
# `proxy_pass http://backend:8000` θα έμενε στην παλιά μέχρι restart του nginx).
resolver 127.0.0.11 valid=10s ipv6=off;

# Συμπίεση για στατικά και JSON. ΟΧΙ για application/x-ndjson: το gzip κρατά δεδομένα μέχρι να μαζέψει αρκετά, και η
# απάντηση του /chat θα ερχόταν μαζεμένη αντί να γράφεται.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Ίδιο όριο με το /upload του backend (50 MB).
    client_max_body_size 50m;

    # Headers ασφαλείας. ΠΡΟΣΟΧΗ: ένα add_header μέσα σε location ακυρώνει ΟΛΑ αυτά για εκείνη τη location· γι' αυτό η
    # cache ορίζεται παρακάτω με `expires`, όχι με add_header.
    #   script-src 'self': το UI δεν έχει inline scripts.
    #   style-src 'unsafe-inline': οι ειδοποιήσεις (sonner) βάζουν style στη σελίδα την ώρα που τρέχει.
    #   img-src blob:: η σελίδα του PDF έρχεται ως blob URL.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;   # οι διαδρομές του backend δεν έχουν /api
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Από τη σύνδεση, όχι ό,τι έστειλε ο πελάτης (αλλιώς θα έγραφε όποια IP ήθελε). Ο backend το διαβάζει ΜΟΝΟ με
        # TRUST_PROXY=1, που ρυθμίζεται στο deploy (βλ. docs/FRONTEND_PLAN, Φάση 3, σημείο 3).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming του /chat: χωρίς αυτό η απάντηση έρχεται όλη μαζί στο τέλος.
        proxy_buffering off;
        proxy_cache off;
        # Τα PDF πάνε κατευθείαν στον backend, χωρίς προσωρινό αρχείο στο nginx.
        proxy_request_buffering off;
        # Αργές απαντήσεις (ειδικά στο laptop) και ανεβάσματα.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Τα αρχεία του build έχουν hash στο όνομα: μένουν στην cache όσο θέλουν.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Το index.html δεν μένει στην cache, ώστε μετά από νέο build να φορτώνει τα νέα αρχεία.
    location = /index.html {
        expires -1;
    }

    # Οι διαδρομές της εφαρμογής (/c/12, /login) ανοίγουν όλες το index.html.
    location / {
        try_files $uri /index.html;
    }
}
